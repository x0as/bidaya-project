<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Completed Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #FF8A00;
            --pink: #FF0080;
            --purple: #8000FF;
            --cyan: #00FFFF;
            --gradient: linear-gradient(135deg, var(--orange) 0%, var(--pink) 30%, var(--purple) 70%, var(--cyan) 100%);
            --bg-primary: #0A0A0A;
            --bg-secondary: #050505;
            --bg-card: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.14);
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            background-image:
                radial-gradient(circle at 15% 30%, rgba(255, 138, 0, 0.12), transparent 45%),
                radial-gradient(circle at 80% 20%, rgba(255, 0, 128, 0.1), transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(0, 255, 255, 0.08), transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .header {
            background: var(--gradient);
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.92;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-light {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-warning {
            background: var(--warning);
            color: #111;
        }

        .content {
            padding: 24px;
            display: grid;
            gap: 20px;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
        }

        .stat .label {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .stat .value {
            font-size: 1.4rem;
            font-weight: 800;
            margin-top: 6px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
        }

        .panel h2 {
            font-size: 1.2rem;
            margin-bottom: 14px;
        }

        .task-list {
            display: grid;
            gap: 12px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .task-meta {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-success {
            background: var(--success);
            color: #111;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .empty {
            color: var(--text-secondary);
            font-style: italic;
            padding: 8px 0;
        }

        .status {
            display: none;
            padding: 10px 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .status.success {
            display: block;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #a7f3d0;
        }

        .status.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fecaca;
        }

        @media (max-width: 700px) {
            .header {
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="header">
            <div>
                <h1>Completed Task Approval</h1>
                <p>Admin page for approving completed tasks, deleting completed items, and releasing taken tasks.</p>
            </div>
            <div class="top-actions">
                <button class="btn btn-light" onclick="window.location.href='admin.html'">Back to Admin</button>
                <button class="btn btn-warning" onclick="releaseAllTaken()">Release All Taken</button>
                <button class="btn btn-light" onclick="loadTasks()">Refresh</button>
            </div>
        </header>

        <section class="content">
            <div id="status" class="status"></div>

            <div class="summary">
                <div class="stat">
                    <div class="label">Pending Approval</div>
                    <div class="value" id="pendingCount">0</div>
                </div>
                <div class="stat">
                    <div class="label">Approved Completed</div>
                    <div class="value" id="approvedCount">0</div>
                </div>
                <div class="stat">
                    <div class="label">Taken Tasks</div>
                    <div class="value" id="takenCount">0</div>
                </div>
            </div>

            <div class="panel">
                <h2>Tasks Waiting For Approval</h2>
                <div class="task-list" id="pendingList"></div>
            </div>

            <div class="panel">
                <h2>Current Completed Tasks</h2>
                <div class="task-list" id="approvedList"></div>
            </div>

            <div class="panel">
                <h2>Currently Taken Tasks</h2>
                <div class="task-list" id="takenList"></div>
            </div>
        </section>
    </main>

    <script>
        let adminUsername = 'Admin';

        function checkAdminAccess() {
            const loggedInUser = sessionStorage.getItem('adminLoggedIn');
            const userInfoRaw = sessionStorage.getItem('userInfo');

            if (!loggedInUser || !userInfoRaw) {
                window.location.href = 'admin.html';
                return false;
            }

            adminUsername = loggedInUser;

            try {
                const userInfo = JSON.parse(userInfoRaw);
                const isAllowed = userInfo.role === 'Founder' || (Array.isArray(userInfo.permissions) && userInfo.permissions.includes('manage_all'));

                if (!isAllowed) {
                    showStatus('Only admins can access this page.', 'error');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 1400);
                    return false;
                }
            } catch (error) {
                window.location.href = 'admin.html';
                return false;
            }

            return true;
        }

        function formatTime(timeValue) {
            if (!timeValue) return 'N/A';
            const time = new Date(timeValue);
            if (Number.isNaN(time.getTime())) return 'N/A';
            return `${time.toLocaleDateString()} ${time.toLocaleTimeString()}`;
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderTaskCard(task, mode) {
            const title = escapeHtml(task.title || task.name || 'Untitled Task');
            const taskId = escapeHtml(task.id || 'unknown');
            const assignedTo = escapeHtml(task.assignedTo || task.takenBy || 'Unassigned');
            const completedBy = escapeHtml(task.completedBy || 'N/A');
            const completedAt = formatTime(task.completedAt);
            const takenBy = escapeHtml(task.takenBy || 'N/A');
            const takenAt = formatTime(task.takenAt);

            let actionButtons = '';

            if (mode === 'pending') {
                actionButtons = `
                    <button class="btn btn-success" onclick="runAction('${taskId}', 'approve')">Approve</button>
                    <button class="btn btn-danger" onclick="runAction('${taskId}', 'delete_completed')">Delete</button>
                `;
            }

            if (mode === 'approved') {
                actionButtons = `
                    <button class="btn btn-danger" onclick="runAction('${taskId}', 'delete_completed')">Delete</button>
                `;
            }

            if (mode === 'taken') {
                actionButtons = `
                    <button class="btn btn-warning" onclick="runAction('${taskId}', 'release_taken')">Release Task</button>
                `;
            }

            const meta = mode === 'taken'
                ? `Taken by ${takenBy} at ${takenAt}`
                : `Assigned: ${assignedTo} | Completed by: ${completedBy} at ${completedAt}`;

            return `
                <article class="task-card">
                    <div class="task-title">${title}</div>
                    <div class="task-meta">Task ID: ${taskId}</div>
                    <div class="task-meta">${meta}</div>
                    <div class="task-actions">${actionButtons}</div>
                </article>
            `;
        }

        function renderList(elementId, tasks, mode) {
            const list = document.getElementById(elementId);
            if (!list) return;

            if (!tasks || tasks.length === 0) {
                list.innerHTML = '<div class="empty">No tasks found.</div>';
                return;
            }

            list.innerHTML = tasks.map((task) => renderTaskCard(task, mode)).join('');
        }

        function showStatus(message, type) {
            const status = document.getElementById('status');
            if (!status) return;

            status.className = `status ${type}`;
            status.textContent = message;

            if (type === 'success') {
                setTimeout(() => {
                    status.className = 'status';
                    status.textContent = '';
                }, 2600);
            }
        }

        async function loadTasks() {
            try {
                const response = await fetch('/api/get-admin-tasks');
                const result = await response.json();

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to load tasks');
                }

                document.getElementById('pendingCount').textContent = result.counts.pendingApproval;
                document.getElementById('approvedCount').textContent = result.counts.completedApproved;
                document.getElementById('takenCount').textContent = result.counts.takenTasks;

                renderList('pendingList', result.pendingApproval, 'pending');
                renderList('approvedList', result.completedApproved, 'approved');
                renderList('takenList', result.takenTasks, 'taken');
            } catch (error) {
                showStatus(error.message || 'Failed to load tasks', 'error');
            }
        }

        async function runAction(taskId, action) {
            const confirmText = action === 'delete_completed'
                ? 'Delete this completed task?'
                : action === 'approve'
                    ? 'Approve this completed task?'
                    : 'Release this taken task back to open?';

            if (!window.confirm(confirmText)) {
                return;
            }

            try {
                const response = await fetch('/api/admin-task-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId, action, adminUser: adminUsername })
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Action failed');
                }

                showStatus(result.message || 'Action completed', 'success');
                await loadTasks();
            } catch (error) {
                showStatus(error.message || 'Action failed', 'error');
            }
        }

        async function releaseAllTaken() {
            if (!window.confirm('Release all currently taken tasks?')) {
                return;
            }

            try {
                const response = await fetch('/api/admin-task-action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskId: 'bulk', action: 'release_all_taken', adminUser: adminUsername })
                });

                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'Failed to release taken tasks');
                }

                showStatus(result.message || 'Taken tasks released', 'success');
                await loadTasks();
            } catch (error) {
                showStatus(error.message || 'Failed to release taken tasks', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAdminAccess()) return;
            await loadTasks();
        });
    </script>
</body>
</html>
